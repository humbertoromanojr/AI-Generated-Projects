name: fluttmov
description: "FLUTTMOV - Aplicativo de descoberta de filmes em Dark Mode."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gerenciamento de Estado
  flutter_bloc: ^8.1.6
  # Injeção de Dependência
  get_it: ^7.6.0
  # Requisições HTTP
  dio: ^5.7.0
  # Programação Funcional
  dartz: ^0.10.1
  # Armazenamento Local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Compartilhamento
  share_plus: ^13.3.0
  # Imagens
  cached_network_image: ^3.3.1
  # Roteamento
  go_router: ^12.1.3
  # Utilitários
  connectivity_plus: ^7.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
