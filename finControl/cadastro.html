<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre um novo lançamento financeiro.">
    <title>finControl · Novo Lançamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <header class="cabecalho">
        <div class="container cabecalho-inner">
            <a class="logo" href="index.html" aria-label="finControl - página inicial">
                <img src="assets/icons/wallet.svg" alt="">
                <span>fin<strong>Control</strong></span>
            </a>
            <nav class="nav" aria-label="Navegação principal">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="cadastro.html" class="nav-link ativo" aria-current="page">Novo Lançamento</a>
            </nav>
        </div>
    </header>

    <main class="container" id="conteudo">
        <section class="hero">
            <a href="index.html" class="link-voltar">
                <img src="assets/icons/arrow-left.svg" alt="">
                Voltar ao dashboard
            </a>
            <h1>Novo Lançamento</h1>
            <p>Cadastre uma receita ou despesa para acompanhar suas finanças.</p>
        </section>

        <section class="cartao">
            <form id="form-lancamento" class="form" autocomplete="off">
                <div class="campo">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" name="tipo" required>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria" required></select>
                </div>

                <div class="campo campo-amplo">
                    <label for="descricao">Descrição</label>
                    <input id="descricao" name="descricao" type="text" placeholder="Ex.: Salário, Supermercado" maxlength="80" autocomplete="off" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input id="valor" name="valor" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input id="data" name="data" type="date" required>
                </div>

                <div class="form-acoes campo-amplo">
                    <a href="index.html" class="botao botao-secundario">Cancelar</a>
                    <button type="submit" class="botao botao-primario">
                        <img src="assets/icons/save.svg" alt="">
                        Salvar
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <div class="container">
            <p>finControl — suas finanças em ordem.</p>
        </div>
    </footer>

    <script type="module" src="js/cadastro.js"></script>
</body>
</html>
